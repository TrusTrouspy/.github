name: Bug
description: Signaler un comportement incorrect reproductible
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: observed
    attributes:
      label: Comportement observé
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Étapes de reproduction
      description: Ne joindre aucune donnée personnelle ou secrète.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      description: Appareil, OS, navigateur ou version de l'application.
  - type: dropdown
    id: severity
    attributes:
      label: Gravité
      options:
        - Bloquant
        - Majeur
        - Mineur
    validations:
      required: true

