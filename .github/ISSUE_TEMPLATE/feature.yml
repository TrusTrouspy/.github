name: Fonctionnalité
description: Proposer un résultat utilisateur pour le MVP
title: "[Feature] "
labels:
  - feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème utilisateur
      description: Qui rencontre quel problème, et avec quelle preuve ?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Résultat attendu
      description: Décrire la valeur obtenue, sans imposer la solution.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Liste de résultats observables et vérifiables.
    validations:
      required: true
  - type: textarea
    id: out
    attributes:
      label: Hors périmètre
      description: Ce qui ne sera volontairement pas traité.

